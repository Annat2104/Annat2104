<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-label="Inspirational quote">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090815"/>
      <stop offset="52%" stop-color="#17102f"/>
      <stop offset="100%" stop-color="#071a2a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="stars" width="93" height="71" patternUnits="userSpaceOnUse">
      <circle cx="13" cy="18" r="1.3" fill="#d8b4fe" opacity=".7"/>
      <circle cx="67" cy="47" r="1" fill="#7dd3fc" opacity=".65"/>
      <path d="M42 8v7 M38.5 11.5h7" stroke="#c4b5fd" stroke-width="1" opacity=".65"/>
    </pattern>
  </defs>
  <rect width="1200" height="230" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="230" rx="18" fill="url(#stars)"/>
  <rect x="7" y="7" width="1186" height="216" rx="14" fill="none" stroke="url(#accent)" stroke-width="2" opacity=".85"/>

  <text x="600" y="70" text-anchor="middle" font-family="Georgia,serif" font-size="50" fill="url(#accent)">“</text>
  <text x="600" y="108" text-anchor="middle" font-family="Verdana,Arial,sans-serif" font-size="22" fill="#fff7ff">Great things are done by a series of</text>
  <text x="600" y="141" text-anchor="middle" font-family="Verdana,Arial,sans-serif" font-size="22" fill="#fff7ff">small things brought together.</text>
  <text x="600" y="184" text-anchor="middle" font-family="Verdana,Arial,sans-serif" font-size="12" letter-spacing="4" fill="url(#accent)">KEEP BLOOMING · KEEP BUILDING</text>
